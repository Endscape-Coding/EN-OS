dontChroot: false
timeout: 300

script:
  - |
    echo "=== Configuring mkinitcpio (safe mode) ==="

    set -e
    set -u
    backup_conf() {
        if [ -f /etc/mkinitcpio.conf ]; then
            cp /etc/mkinitcpio.conf /etc/mkinitcpio.conf.backup
            echo "Backup created: /etc/mkinitcpio.conf.backup"
        fi
    }

    detect_root_fs() {
        local fs=""
        echo "Detecting root filesystem..."

        if grep -qE ' / ' /proc/mounts; then
            while read -r dev mnt fstype _; do
                if [ "$mnt" = "/" ]; then
                    fs="$fstype"
                    break
                fi
            done < /proc/mounts
        fi

        if [ -z "$fs" ] && command -v findmnt >/dev/null 2>&1; then
            fs=$(findmnt -n -o FSTYPE / 2>/dev/null || true)
        fi

        if [ -z "$fs" ] && command -v blkid >/dev/null 2>&1; then
            dev=$(grep -E ' / ' /proc/mounts | awk '{print $1}' | head -n1 || true)
            if [ -n "$dev" ]; then
                fs=$(blkid -o value -s TYPE "$dev" 2>/dev/null || true)
            fi
        fi

        if [ -z "$fs" ]; then
            echo "Warning: Could not determine root filesystem; defaulting to 'ext4'"
            fs="ext4"
        fi

        echo "$fs"
    }

    backup_conf

    ROOT_FS=$(detect_root_fs)
    echo "Detected root filesystem: $ROOT_FS"

    HOOKS="base systemd autodetect modconf kms keyboard sd-vconsole block filesystems fsck"

    case "$ROOT_FS" in
        btrfs)
            HOOKS="base systemd autodetect modconf kms keyboard sd-vconsole block sd-encrypt btrfs filesystems fsck"
            ;;
        xfs)
            HOOKS="base systemd autodetect modconf kms keyboard sd-vconsole block xfs filesystems fsck"
            ;;
        f2fs)
            HOOKS="base systemd autodetect modconf kms keyboard sd-vconsole block f2fs filesystems fsck"
            ;;
        zfs)
            HOOKS="base systemd autodetect modconf kms keyboard sd-vconsole block zfs filesystems fsck"
            ;;
        nilfs2)
            HOOKS="base systemd autodetect modconf kms keyboard sd-vconsole block nilfs2 filesystems fsck"
            ;;
        reiserfs)
            HOOKS="base systemd autodetect modconf kms keyboard sd-vconsole block reiserfs filesystems fsck"
            ;;
        ext4|ext3|ext2)
            HOOKS="base systemd autodetect modconf kms keyboard sd-vconsole block filesystems fsck"
            ;;
        *)
            echo "Unknown FS '$ROOT_FS', using generic hooks"
            ;;
    esac

    if blkid -t TYPE=crypto_LUKS >/dev/null 2>&1 || blkid -t TYPE=crypto_luks >/dev/null 2>&1; then
        echo "LUKS encryption detected, enabling sd-encrypt hook"
        case "$HOOKS" in
            *sd-encrypt*) ;; # уже есть
            *) HOOKS="sd-encrypt $HOOKS" ;;
        esac
    fi

    cat > /etc/mkinitcpio.conf <<EOF

    MODULES=()
    BINARIES=()
    FILES=()
    HOOKS=($HOOKS)
    COMPRESSION="zstd"
    COMPRESSION_OPTIONS=()
    MICROCODE=(all)
    EOF

    echo "mkinitcpio.conf written with hooks: $HOOKS"

    echo "Regenerating initramfs..."
    if command -v mkinitcpio >/dev/null 2>&1; then
        mkinitcpio -P || echo "mkinitcpio -P failed"
    else
        echo "Warning: mkinitcpio not found. Skipping initramfs generation."
    fi

    if command -v mkinitcpio >/dev/null 2>&1 && [ -d /boot ]; then
        for KERNEL in /boot/vmlinuz-*; do
            [ -f "$KERNEL" ] || continue
            KVER=$(basename "$KERNEL" | sed 's|vmlinuz-||')
            echo "→ Regenerating initramfs for kernel: $KVER"
            mkinitcpio -k "$KVER" -g "/boot/initramfs-${KVER}.img" || echo "Failed for $KVER"
        done
    fi

    echo "=== mkinitcpio configuration completed successfully ==="
