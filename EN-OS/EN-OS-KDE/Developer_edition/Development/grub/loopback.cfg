search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

if [ "${grub_platform}" = "efi" ]; then
    archiso_platform="UEFI"
    case "${grub_cpu}" in
        x86_64) archiso_platform="x64 ${archiso_platform}" ;;
        i386)   archiso_platform="IA32 ${archiso_platform}" ;;
        *)      archiso_platform="${grub_cpu} ${archiso_platform}" ;;
    esac
elif [ "${grub_platform}" = "pc" ]; then
    archiso_platform="BIOS"
else
    archiso_platform="${grub_cpu} ${grub_platform}"
fi

set default="archlinux"
set timeout=15
set timeout_style=menu

function boot_iso {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" $1
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "EN-OS dev edition install medium (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id "archlinux" {
    boot_iso ""
}

menuentry "EN-OS dev edition install medium with speakup screen reader (%ARCH%, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id "archlinux-accessibility" {
    boot_iso "accessibility=on"
}

if [ -f "/boot/memtest86+/memtest" ]; then
    menuentry "Run Memtest86+ (RAM test)" --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        if [ "${grub_platform}" = "efi" -a -f "/boot/memtest86+/memtest.efi" ]; then
            chainloader /boot/memtest86+/memtest.efi
        else
            linux /boot/memtest86+/memtest
        fi
    }
fi

if [ "${grub_platform}" = "efi" ]; then
    if [ "${grub_cpu}" = "x86_64" -a -f "/shellx64.efi" ]; then
        menuentry "UEFI Shell" --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" = "i386" -a -f "/shellia32.efi" ]; then
        menuentry "UEFI Shell" --class efi {
            chainloader /shellia32.efi
        }
    fi

    menuentry "UEFI Firmware Settings" --id "uefi-firmware" {
        fwsetup
    }
fi

menuentry "System shutdown" --class shutdown --class poweroff {
    echo "System shutting down..."
    halt
}

menuentry "System restart" --class reboot --class restart {
    echo "System rebooting..."
    reboot
}
