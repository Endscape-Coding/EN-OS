# ======================
# EN-OS - GRUB2 Main Configuration
# ======================

insmod all_video
insmod gfxterm
insmod png
insmod font
insmod part_gpt
insmod part_msdos
insmod ext2
insmod fat
insmod iso9660

### Set graphical mode
if loadfont "${prefix}/fonts/unicode.pf2"; then
    set gfxmode=auto
    terminal_output gfxterm
fi

### Load gfxmenu Theme
insmod gfxmenu
if [ -f "${prefix}/themes/midnight-ocean/theme.txt" ]; then
    load_theme "${prefix}/themes/midnight-ocean/theme.txt"
fi

### Platform detection
if [ "${grub_platform}" = "efi" ]; then
    set bootmode="UEFI"
    set arch_label="x64"
else
    set bootmode="BIOS"
    set arch_label="%ARCH%"
fi

### Main menu configuration
set default="en-os-standard"
set timeout=5
set timeout_style=menu

### Helper function for live boot entries
function boot_live {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% "$1"
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry " EN-OS IceWM Live Environment " --class os --id en-os-standard {
    boot_live "quiet splash"
}

menuentry " Safe Graphics Mode " --class recovery {
    boot_live "nomodeset"
}

submenu " Advanced Options " --class advanced {
    menuentry " Debug Mode " --class debug {
        boot_live "debug"
    }

    menuentry " Memory Test (Memtest86+) " --class memtest {
        if [ "${grub_platform}" = "efi" ] && [ -f "/boot/memtest86+/memtest.efi" ]; then
            chainloader /boot/memtest86+/memtest.efi
        elif [ "${grub_platform}" = "pc" ] && [ -f "/boot/memtest86+/memtest" ]; then
            linux /boot/memtest86+/memtest
        else
            echo "Memtest86+ not found"
            sleep 5
        fi
    }
}

### UEFI Firmware Settings
if [ "${grub_platform}" = "efi" ]; then
    menuentry " UEFI Firmware Settings " --class efi --id uefi-firmware {
        fwsetup
    }
fi

### System Controls
menuentry " System Shutdown " --class shutdown {
    halt
}

menuentry " System Restart " --class reboot {
    reboot
}

echo "EN-OS Bootloader initialized successfully."
