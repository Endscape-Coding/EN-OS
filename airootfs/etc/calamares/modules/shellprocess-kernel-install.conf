dontChroot: false
timeout: 300

script:
    - |
      echo "=== KERNEL REINSTALL FROM LOCAL PACKAGES ==="

      # Переустанавливаем ядро из указанной папки
      pacman -U --noconfirm /etc/linux/linux.pkg.tar.zst
      pacman -U --noconfirm /etc/linux/linux-headers.pkg.tar.zst

      # Принудительно пересоздаем initramfs
      mkinitcpio -P

      echo "✓ Kernel reinstalled from /etc/linux/"
