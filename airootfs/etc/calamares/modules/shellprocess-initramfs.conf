dontChroot: false
timeout: 300

script:
    - |
      # Создаем правильный mkinitcpio.conf
      cat > /etc/mkinitcpio.conf << 'EOF'
      MODULES=()
      BINARIES=()
      FILES=()
      HOOKS=(base systemd autodetect modconf kms keyboard sd-vconsole block filesystems fsck)
      COMPRESSION="zstd"
      COMPRESSION_OPTIONS=()
      EOF

      # Пересоздаем initramfs
      mkinitcpio -P

      # Создаем резервную копию оригинального конфига
      cp /etc/mkinitcpio.conf /etc/mkinitcpio.conf.backup

      echo "Initramfs configuration completed successfully"
